[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stm32timing"
version = "0.1.0"
description = "Capture and analyse timing measurements from the STM32 timing lab firmware"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "matplotlib>=3.5", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stm32timing = "stm32timing.__main__:main"

[tool.setuptools]
packages = ["stm32timing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
